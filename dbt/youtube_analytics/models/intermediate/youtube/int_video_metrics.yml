version: 2

models:
  - name: int_video_metrics
    description: >
      Intermediate YouTube analytics model containing video-level metrics,
      derived date attributes, engagement metrics, conversion metrics,
      and watch-time efficiency metrics. Built from stg_youtube_videos.

    columns:
      - name: video_id
        description: Unique identifier for each YouTube video.
        data_tests:
          - not_null
          - unique

      - name: upload_timestamp
        description: Timestamp when the video was uploaded.
        data_tests:
          - not_null

      - name: upload_year
        description: Year in which the video was uploaded.
        data_tests:
          - not_null

      - name: upload_month
        description: Numeric month in which the video was uploaded.
        data_tests:
          - not_null

      - name: upload_quarter
        description: Quarter in which the video was uploaded.

      - name: upload_day_of_week
        description: Day of the week on which the video was uploaded.

      - name: video_duration_minutes
        description: Total duration of the video in minutes.

      - name: avg_view_duration_seconds
        description: Average duration watched by viewers, in seconds.

      - name: avg_view_percentage
        description: Average percentage of the video watched by viewers.

      - name: impressions
        description: Number of times the video thumbnail was shown to viewers.
        data_tests:
          - not_null

      - name: likes
        description: Total number of likes received by the video.

      - name: comments
        description: Total number of comments received by the video.

      - name: shares
        description: Total number of times the video was shared.

      - name: click_through_rate
        description: Percentage of impressions that resulted in a video view.

      - name: subscribers_gained
        description: Number of subscribers gained from the video.

      - name: total_watch_time_hours
        description: Total watch time generated by the video, measured in hours.

      - name: traffic_source
        description: Traffic source through which viewers discovered the video.

      - name: content_category
        description: Content category associated with the video.

      - name: engagement
        description: >
          Total engagement generated by the video, calculated as the sum
          of likes, comments, and shares.

      - name: engagement_rate
        description: >
          Engagement as a percentage of impressions, calculated from likes,
          comments, and shares.

      - name: like_rate
        description: Likes as a percentage of impressions.

      - name: comment_rate
        description: Comments as a percentage of impressions.

      - name: share_rate
        description: Shares as a percentage of impressions.

      - name: subscriber_conversion_rate
        description: Subscribers gained as a percentage of impressions.

      - name: watch_time_per_impression
        description: Total watch time in hours generated per impression.
