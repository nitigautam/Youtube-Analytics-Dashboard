version: 2

models:
  - name: mart_executive_overview
    description: >
      Executive-level monthly YouTube analytics mart containing aggregated
      performance KPIs including impressions, engagement, subscribers,
      watch time, CTR, and viewer retention metrics. This model powers
      the YouTube Analytics Executive Dashboard and Cortex Analyst.

data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - upload_year
              - upload_month
      
    columns:
      - name: upload_year
        description: Year of the aggregated YouTube performance data.
        data_tests:
          - not_null

      - name: upload_month
        description: Numeric month of the aggregated YouTube performance data.
        data_tests:
          - not_null

      - name: total_videos
        description: Total number of videos published during the month.
        data_tests:
          - not_null

      - name: total_impressions
        description: Total impressions generated by videos during the month.
        data_tests:
          - not_null

      - name: total_likes
        description: Total likes received during the month.

      - name: total_comments
        description: Total comments received during the month.

      - name: total_shares
        description: Total shares generated during the month.

      - name: total_subscribers_gained
        description: Total subscribers gained during the month.

      - name: total_watch_time_hours
        description: Total watch time generated during the month, measured in hours.

      - name: avg_ctr
        description: Average click-through rate across videos published during the month.

      - name: avg_view_duration_seconds
        description: Average viewer watch duration in seconds during the month.

      - name: avg_view_percentage
        description: Average percentage of video content watched during the month.

      - name: avg_engagement_rate
        description: Average engagement rate across videos during the month.

      - name: avg_subscriber_conversion_rate
        description: Average subscriber conversion rate across videos during the month.
